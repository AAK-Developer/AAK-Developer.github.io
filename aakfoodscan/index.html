<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAK FoodScan</title>
<style>
  :root{
    --tinta:#1a2b33;
    --tinta-suave:#4a5c64;
    --linea:#e2e8ea;
    --fondo:#ffffff;
    --acento:#2f7d52;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--tinta);
    line-height:1.62;
    max-width:820px;
    margin:0 auto;
    padding:0 28px 96px;
    background:var(--fondo);
    font-size:16px;
  }
  nav { padding: 20px 0 0; font-size: 13px; color: var(--tinta-suave); }
  nav a { color: var(--tinta-suave); text-decoration: none; }
  header { padding: 28px 0 24px; border-bottom: 2px solid var(--acento); margin-bottom: 8px; }
  .icon { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; margin-bottom: 18px; }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lead { font-size: 1.02rem; color: var(--tinta-suave); max-width: 540px; margin: 0; }
  .status { display: inline-block; margin-top: 16px; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 100px; background: rgba(31,61,58,0.06); color: var(--tinta-suave); }
  .links { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; padding: 28px 0 8px; }
  .links a { color: var(--acento); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav>
  <a href="/">AAK Developer</a> ›
  <span style="color:var(--tinta);">AAK FoodScan</span>
</nav>

<header>
  <div class="icon"><img src="/aakfoodscan.png" alt="AAK FoodScan"></div>
  <h1>AAK FoodScan</h1>
  <p class="lead">Escanea el código de barras de un producto y compáralo al instante con tu perfil de alérgenos e ingredientes a evitar.</p>
  <span class="status">Próximamente</span>
</header>

<div class="links">
  <a href="/aakfoodscan/privacy/">Política de Privacidad</a>
  <a href="/aakfoodscan/legal/">Aviso Legal</a>
  <a href="/aakfoodscan/terms/">Términos de Uso</a>
  <a href="/aakfoodscan/support/">Soporte</a>
  <a href="/aakfoodscan/delete-account/">Eliminar mi cuenta</a>
</div>

</body>
</html>

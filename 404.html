<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAK Developer</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 80px;
    line-height: 1.65;
    color: #1c1c1e;
    background: #fafafa;
  }
  nav { padding: 20px 0 0; font-size: 13px; color: #888; }
  nav a { color: #888; text-decoration: none; }
  header { padding: 28px 0 24px; border-bottom: 3px solid #E94553; margin-bottom: 24px; }
  h1 { font-size: 26px; color: #993556; margin: 0 0 8px; }
  .lead { font-size: 16px; color: #444; max-width: 520px; margin: 0; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0 8px; }
  .actions a { text-decoration: none; padding: 12px 20px; border-radius: 10px; font-size: 14.5px; font-weight: 600; }
  .btn-primary { background: #1c1c1e; color: #fff; }
  .btn-secondary { background: #f2f2f7; color: #1c1c1e; }
  .hint { font-size: 13px; color: #888; margin-top: 24px; }
</style>
</head>
<body>

<nav><a href="/">AAK Developer</a></nav>

<header id="cabecera">
  <h1 id="titulo">Página no encontrada</h1>
  <p class="lead" id="texto">No existe nada en esta dirección.</p>
</header>

<div class="actions" id="acciones"></div>
<p class="hint" id="pista"></p>

<script>
  // GitHub Pages sirve este archivo para cualquier ruta que no exista
  // como fichero real — window.location.pathname conserva la URL
  // original tal como se pidió, así que se puede distinguir aquí qué
  // pedía el enlace. /aakpills/invite/<token> y
  // /aakpills/auth-complete son objetivos de Universal Links / App
  // Links (ver apple-app-site-association y assetlinks.json): con la
  // app instalada, el sistema operativo intercepta el enlace ANTES de
  // llegar aquí — esta página solo la ve quien no tiene la app, o algún
  // caso raro donde el sistema no intercepta (p. ej. un navegador
  // dentro de otra app). Por eso el mensaje es "descárgala", no un error.
  var ruta = window.location.pathname;
  var titulo = document.getElementById('titulo');
  var texto = document.getElementById('texto');
  var acciones = document.getElementById('acciones');
  var pista = document.getElementById('pista');
  var APP_STORE = 'https://apps.apple.com/es/app/aak-pills/id6795228256';

  function botonAppStore() {
    var a = document.createElement('a');
    a.className = 'btn-primary';
    a.href = APP_STORE;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = 'Descargar AAK Pills en App Store';
    return a;
  }

  if (ruta.indexOf('/aakpills/invite/') === 0) {
    titulo.textContent = 'Invitación de AAK Pills';
    texto.textContent = 'Este enlace es una invitación para compartir el cuidado de un familiar en AAK Pills. Si ya tienes la app instalada en este mismo dispositivo, vuelve a abrir el enlace desde el correo o mensaje original (no copiado a mano) — debería abrirse directamente en la app. Si no la tienes instalada todavía:';
    acciones.appendChild(botonAppStore());
    pista.textContent = 'Tras instalarla, abre de nuevo este mismo enlace de invitación.';
  } else if (ruta.indexOf('/aakpills/auth-complete') === 0) {
    titulo.textContent = 'Volviendo a AAK Pills…';
    texto.textContent = 'Esto es un paso intermedio de "Continuar con Apple". Si la app no se ha abierto sola, vuelve a ella manualmente — el inicio de sesión ya debería haberse completado.';
    var btn = document.createElement('a');
    btn.className = 'btn-secondary';
    btn.href = '/aakpills/';
    btn.textContent = 'Más sobre AAK Pills';
    acciones.appendChild(btn);
  } else {
    var btn2 = document.createElement('a');
    btn2.className = 'btn-secondary';
    btn2.href = '/';
    btn2.textContent = 'Ir al inicio';
    acciones.appendChild(btn2);
  }
</script>

</body>
</html>
